server:
  url: http://localhost:8080

tailcat:
  # Missing binaries are downloaded to ~/.tailcat-mesh/tailcat/v0.3.0.
  version: 0.3.0
  autoDownload: true
  supportedVersion: 0.3.x
  serverKey: tailcat-mesh-server
  clientKey: tailcat-mesh-client
  fullAddress: true

agent:
  dataDir: ./data/agent2
  heartbeatSeconds: 15
  peerPingSeconds: 30

# Agent 2 uses a different Wintun adapter so both local Agents can run together.
virtualLan:
  enabled: true
  interfaceName: TailcatMeshAgent2
  adapterGuid: 8e3b9ec1-7f7a-5e37-ae7f-af1f5e3d7c82
  # agent2.ps1 prepares these files in the shared per-user cache.
  wintunDll: ~/.tailcat-mesh/virtual-lan/windows/wintun.dll
  tun2socksBinary: ~/.tailcat-mesh/virtual-lan/windows/tun2socks.exe
  workingDirectory: ~/.tailcat-mesh/virtual-lan/windows
  tun2socksArguments:
    - --device
    - tun://${tun}?guid={8e3b9ec1-7f7a-5e37-ae7f-af1f5e3d7c82}
    - --proxy
    - ${proxy}
    - --loglevel
    - info
  commandTimeoutSeconds: 15
  startupTimeoutSeconds: 20
