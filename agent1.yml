server:
  url: http://localhost:8080

tailcat:
  # Missing binaries are downloaded to ~/.tailcat-mesh/tailcat/v0.3.0.
  version: 0.3.0
  autoDownload: true
  supportedVersion: 0.3.x
  serverKey: tailcat-mesh-server
  clientKey: tailcat-mesh-client
  fullAddress: true

agent:
  dataDir: ./data/agent
  heartbeatSeconds: 15
  peerPingSeconds: 30

# Agent 1 uses its own Wintun adapter. M7 is TCP-first; no default route is added.
virtualLan:
  enabled: true
  interfaceName: TailcatMeshAgent1
  adapterGuid: 7d2a8db0-6f69-4d26-9d6e-9e0e4d2c6b71
  # agent1.ps1 prepares these files in the shared per-user cache.
  wintunDll: ~/.tailcat-mesh/virtual-lan/windows/wintun.dll
  tun2socksBinary: ~/.tailcat-mesh/virtual-lan/windows/tun2socks.exe
  workingDirectory: ~/.tailcat-mesh/virtual-lan/windows
  tun2socksArguments:
    - --device
    - tun://${tun}?guid={7d2a8db0-6f69-4d26-9d6e-9e0e4d2c6b71}
    - --proxy
    - ${proxy}
    - --loglevel
    - info
  commandTimeoutSeconds: 15
  startupTimeoutSeconds: 20
