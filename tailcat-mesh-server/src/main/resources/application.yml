spring:
  application:
    name: tailcat-mesh-server
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/tailcat-mesh;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

tailcat-mesh:
  security:
    require-https: true
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  agent:
    heartbeat-timeout-seconds: 45
  enrollment:
    default-expire-hours: 24
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
